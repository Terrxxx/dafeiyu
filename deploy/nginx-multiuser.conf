map $http_x_forwarded_proto $dafeiyu_scheme { default $scheme; https https; }
server {
 listen 3081;
 server_name 192.168.1.149 dafeiyu.yrxs.net;
 allow 192.168.1.0/24; allow 127.0.0.1; deny all;
 client_max_body_size 512k;
 location / {
  proxy_pass http://127.0.0.1:13082;
  proxy_set_header Host $http_host;
  proxy_set_header Origin $http_origin;
  proxy_set_header X-Forwarded-Proto $dafeiyu_scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 180s;
 }
}
server {
 listen 6099;
 server_name 192.168.1.149;
 return 410;
}
