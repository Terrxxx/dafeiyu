# 示例：替换证书路径和 WINDOWS_TUNNEL_PORT 后，在 Windows Nginx 中测试并启用
# NAS隧道的目标应为NAS上的127.0.0.1:3081
server {
 listen 80;
 server_name dafeiyu.yrxs.net;
 return 301 https://$host$request_uri;
}
server {
 listen 443 ssl;
 server_name dafeiyu.yrxs.net;
 ssl_certificate C:/n/dafeiyu.yrxs.net_bundle.crt;
 ssl_certificate_key C:/n/dafeiyu.yrxs.net.key;
 client_max_body_size 512k;
 location / {
  proxy_pass http://127.0.0.1:WINDOWS_TUNNEL_PORT;
  proxy_set_header Host $host;
  proxy_set_header Origin $http_origin;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 180s;
 }
}
